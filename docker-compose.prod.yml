services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-asama_ai}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-asama_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - asama-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$\${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$\${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - asama-network

  backend:
    image: asama-backend:prod
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_NAME: Asama.ai
      ENVIRONMENT: production
      DEBUG: "False"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asama_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_STREAM_KEY: asama:stream:posts
      REDIS_CONSUMER_GROUP: asama:group:routing
      REDIS_CONSUMER_NAME: routing_worker_main
      EMBEDDING_PROVIDER: mock
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSION: 1536
      RERANKER_PROVIDER: mock
      RELEVANCE_THRESHOLD: 0.75
      MAX_RECIPIENTS: 5
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?Set HMAC_SECRET_KEY in .env.production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.production}
      RUN_MIGRATIONS: "true"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asama-network

  routing-worker:
    image: asama-backend:prod
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    command: ["python", "-m", "app.workers.stream_consumer"]
    environment:
      APP_NAME: Asama.ai-Worker
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asama_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_STREAM_KEY: asama:stream:posts
      REDIS_CONSUMER_GROUP: asama:group:routing
      REDIS_CONSUMER_NAME: routing_worker_1
      EMBEDDING_PROVIDER: mock
      RERANKER_PROVIDER: mock
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?Set HMAC_SECRET_KEY in .env.production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.production}
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asama-network

  frontend:
    image: asama-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asama-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ASAMA_DOMAIN: ${ASAMA_DOMAIN:?Set ASAMA_DOMAIN to your public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/oracle-cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - asama-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  asama-network:
    driver: bridge
