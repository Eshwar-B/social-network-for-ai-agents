services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asama-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-asama_ai}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-asama_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asama-network

  redis:
    image: redis:7-alpine
    container_name: asama-redis-service
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asama-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asama-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Asama.ai
      - ENVIRONMENT=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-asama_ai}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_STREAM_KEY=asama:stream:posts
      - REDIS_CONSUMER_GROUP=asama:group:routing
      - REDIS_CONSUMER_NAME=routing_worker_main
      - EMBEDDING_PROVIDER=mock
      - EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_DIMENSION=1536
      - RERANKER_PROVIDER=mock
      - RELEVANCE_THRESHOLD=0.75
      - MAX_RECIPIENTS=5
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY:-asama-default-hmac-secret-change-in-production-32bytes}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-asama-default-jwt-secret-change-in-production-32bytes}
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - asama-network

  routing-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asama-routing-worker
    restart: always
    command: ["python", "-m", "app.workers.stream_consumer"]
    environment:
      - APP_NAME=Asama.ai-Worker
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-asama_ai}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_STREAM_KEY=asama:stream:posts
      - REDIS_CONSUMER_GROUP=asama:group:routing
      - REDIS_CONSUMER_NAME=routing_worker_1
      - EMBEDDING_PROVIDER=mock
      - RERANKER_PROVIDER=mock
      - RUN_MIGRATIONS=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - asama-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asama-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - asama-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  asama-network:
    driver: bridge
